<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ed Lazarchuk | Portfolio</title>
  <meta name="description" content="Tools for trading, training, and the web — projects by Ed Lazarchuk.">
  <link rel="canonical" href="https://edlazarchuk.com/">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
  <script src="/canvas.js" defer></script>
</head>
<body class="portfolio floating-canvas">
  <a class="skip-link" href="#main-content">Skip to content</a>

  <header class="canvas-header">
    <a class="wordmark reveal-item" style="--reveal-delay: 0ms" href="/">Ed Lazarchuk</a>
  </header>

  <main id="main-content" class="canvas-split" tabindex="-1">
    <div class="canvas-left">
      <h1 class="canvas-headline">
        <span class="headline-line reveal-item" style="--reveal-delay: 70ms">Tools for trading,</span>
        <span class="headline-line reveal-item" style="--reveal-delay: 140ms">training, and the web.</span>
      </h1>
    </div>

    <div class="canvas-right" id="projects">
      <nav class="index-nav" aria-label="Projects">
        <ol class="index-list" role="list" id="index-list">
          <li class="index-group reveal-item" style="--reveal-delay: 200ms" data-category="trading">
            <button
              type="button"
              class="index-row index-toggle"
              id="index-trading"
              aria-expanded="false"
              aria-controls="trading-sublist"
              data-preview="trading"
            >
              <span class="index-num" aria-hidden="true">01</span>
              <span class="index-label">Trading</span>
              <span class="index-mobile-hint" aria-hidden="true">2 tools</span>
              <span class="index-indicator-icon" aria-hidden="true">
                <svg viewBox="0 0 12 12" width="11" height="11" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
                  <path class="icon-h" d="M2.5 6h7"/>
                  <path class="icon-v" d="M6 2.5v7"/>
                </svg>
              </span>
            </button>
            <div class="index-sublist-panel" id="trading-sublist" hidden>
              <div class="index-sublist-inner">
                <ul class="index-sublist" role="list">
                  <li>
                    <a
                      class="index-sublink"
                      href="/projects/trading-strategy-research"
                      data-preview="trading-research"
                    >
                      <span class="sublink-text">Price Action Futures System</span>
                      <span class="sublink-arrow" aria-hidden="true">↗</span>
                    </a>
                  </li>
                  <li>
                    <a
                      class="index-sublink"
                      href="/projects/traders-dashboard"
                      data-preview="traders-dashboard"
                    >
                      <span class="sublink-text">Traders Dashboard</span>
                      <span class="sublink-arrow" aria-hidden="true">↗</span>
                    </a>
                  </li>
                </ul>
              </div>
            </div>
          </li>

          <li class="index-group reveal-item" style="--reveal-delay: 260ms" data-category="training">
            <a
              class="index-row"
              id="index-training"
              href="/projects/woded"
              data-preview="training"
            >
              <span class="index-num" aria-hidden="true">02</span>
              <span class="index-label">Training</span>
              <span class="index-mobile-hint" aria-hidden="true">WODed ↗</span>
            </a>
          </li>

          <li class="index-group reveal-item" style="--reveal-delay: 320ms" data-category="web">
            <a
              class="index-row"
              id="index-web"
              href="/whop-downloader"
              data-preview="web"
            >
              <span class="index-num" aria-hidden="true">03</span>
              <span class="index-label">Web</span>
              <span class="index-mobile-hint" aria-hidden="true">Whop Downloader ↗</span>
            </a>
          </li>
        </ol>
      </nav>

      <div class="preview-stage" aria-hidden="true">
        <div class="floating-card" id="floating-card" data-visible="false">
          <span class="floating-card-caret"></span>
          <div class="floating-card-body" id="floating-card-body"></div>
        </div>
      </div>
    </div>
  </main>

  <!-- Preview card templates (declarative, zero innerHTML string building) -->
  <template id="tpl-preview-trading">
    <div class="fc-eyebrow">01 · Trading · 2 tools</div>
    <div class="fc-title">Trading Tools</div>
    <p class="fc-desc">Price action playbook and futures analytics for NQ &amp; ES execution.</p>
    <div class="fc-snippet fc-snippet-stack">
      <div class="fc-mini-row">
        <span class="fc-mini-dot"></span>
        <span class="fc-mini-name">Price Action Playbook</span>
      </div>
      <div class="fc-mini-row">
        <span class="fc-mini-dot fc-mini-dot-muted"></span>
        <span class="fc-mini-name">Traders Dashboard</span>
      </div>
    </div>
  </template>

  <template id="tpl-preview-trading-research">
    <div class="fc-eyebrow">Trading Research</div>
    <div class="fc-title">Price Action Futures System</div>
    <p class="fc-desc">Step-by-step playbook for futures setups, position sizing, and execution.</p>
    <div class="fc-snippet fc-snippet-steps">
      <span class="fc-step is-highlight">Prep</span>
      <span class="fc-step">Setup</span>
      <span class="fc-step">Risk</span>
      <span class="fc-step">Exec</span>
    </div>
  </template>

  <template id="tpl-preview-traders-dashboard">
    <div class="fc-eyebrow">Trading Performance</div>
    <div class="fc-title">Traders Dashboard</div>
    <p class="fc-desc">Daily trade summaries, performance curves, and Risk Lab sizing.</p>
    <div class="fc-snippet fc-snippet-chart">
      <svg class="fc-sparkline" viewBox="0 0 180 42" fill="none" aria-hidden="true">
        <line x1="0" y1="34" x2="180" y2="34" stroke="#E5E7EB" stroke-width="1"/>
        <line x1="0" y1="18" x2="180" y2="18" stroke="#E5E7EB" stroke-width="1" stroke-dasharray="2 3"/>
        <path d="M2 35 L24 27 L42 30 L68 19 L92 22 L120 11 L142 15 L164 6 L178 8" stroke="#1D4ED8" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="178" cy="8" r="2.5" fill="#1D4ED8"/>
      </svg>
      <div class="fc-chip-row">
        <span>NQ</span>
        <span>ES</span>
        <span>Risk Lab</span>
      </div>
    </div>
  </template>

  <template id="tpl-preview-training">
    <div class="fc-eyebrow">02 · WODed</div>
    <div class="fc-title">Training Tools</div>
    <p class="fc-desc">Daily workouts, EMOM &amp; AMRAP timers, and personal training log.</p>
    <div class="fc-snippet fc-snippet-wod">
      <div class="fc-wod-top">
        <span class="fc-wod-name">Short Circuit</span>
        <span class="fc-wod-clock">20:00</span>
      </div>
      <div class="fc-wod-meta">EMOM · 5 rounds · Rx / Fx</div>
    </div>
  </template>

  <template id="tpl-preview-web">
    <div class="fc-eyebrow">03 · Chrome Extension</div>
    <div class="fc-title">Whop Downloader</div>
    <p class="fc-desc">Detects supported Whop videos and adds a one-click download button.</p>
    <div class="fc-snippet fc-snippet-ext">
      <span class="fc-ext-status">
        <span class="fc-ext-dot"></span>
        Video detected
      </span>
      <span class="fc-ext-pill">↓ Download</span>
    </div>
  </template>
</body>
</html>
